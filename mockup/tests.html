<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PDPA Hub — Data Checks</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><section class="view active"><div class="card"><h1 style="font-size:28px">Data Integrity Checks</h1><div id="results" style="margin-top:16px"></div></div></section></main>
<script src="data.js"></script>
<script>
const out = document.getElementById('results'); let pass=0, fail=0;
function check(name, fn) { let ok=false, d=''; try { const r=fn(); ok=r===true||r===undefined; if(typeof r==='string'){ok=false;d=r;} } catch(e){d=e.message;} ok?pass++:fail++; out.innerHTML += '<div style="padding:8px 12px;margin-bottom:6px;border-radius:8px;background:' + (ok?'rgba(16,185,129,0.1)':'rgba(239,68,68,0.1)') + ';font-size:13px"><b>' + (ok?'PASS':'FAIL') + '</b> ' + name + (d?' — '+d:'') + '</div>'; }
check('Bingo has 16 items', () => BINGO_ITEMS.length===16?true:'found '+BINGO_ITEMS.length);
check('Jeopardy 5 cats x 3 tiles', () => { if(JEOPARDY.length!==5) return 'cats: '+JEOPARDY.length; return JEOPARDY.every(c=>c.tiles.length===3)?true:'bad tile count'; });
check('Jeopardy values sum to MAX', () => { const s=JEOPARDY.reduce((a,c)=>a+c.tiles.reduce((b,t)=>b+t.value,0),0); return s===MAX_SCORE.jeopardy?true:s+' vs '+MAX_SCORE.jeopardy; });
check('Crossword intersections agree', () => { const g=new Map(); let bad=[]; CROSSWORD.entries.forEach(e=>{for(let i=0;i<e.answer.length;i++){const r=e.dir==='down'?e.row+i:e.row;const c=e.dir==='across'?e.col+i:e.col;const k=r+','+c;if(g.has(k)&&g.get(k)!==e.answer[i])bad.push(k);g.set(k,e.answer[i]);}}); return bad.length?bad.join(';'):true; });
check('Risk has 16 cards', () => RISK_CARDS.length===16?true:'found '+RISK_CARDS.length);
check('MAX_TOTAL correct', () => { const s=Object.values(MAX_SCORE).reduce((a,b)=>a+b,0); return s===MAX_TOTAL?true:s+' vs '+MAX_TOTAL; });
check('No PETRONAS references in data', () => { const src=JSON.stringify({BINGO_ITEMS,JEOPARDY,CROSSWORD,RISK_CARDS}); return src.toLowerCase().includes('petronas')?'found reference':true; });
out.innerHTML += '<p style="margin-top:16px;font-weight:700;color:' + (fail?'#EF4444':'#10B981') + '">' + pass + ' passed, ' + fail + ' failed</p>';
</script></body></html>
